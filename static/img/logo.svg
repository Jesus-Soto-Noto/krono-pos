<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Geometric Anime.js inspired Prism / Box -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="50,14 84,33 50,52 16,33" fill="url(#gradTop)" />
    
    <!-- Left Face -->
    <polygon points="16,33 50,52 50,88 16,69" fill="url(#gradLeft)" />
    
    <!-- Right Face -->
    <polygon points="50,52 84,33 84,69 50,88" fill="url(#gradRight)" />

    <!-- Inner Core Geometric Accents -->
    <polygon points="50,30 68,40 50,50 32,40" fill="#ffffff" opacity="0.3" />
    
    <!-- Pulse Center Node -->
    <circle cx="50" cy="52" r="5" fill="#38bdf8" />
    <circle cx="50" cy="52" r="2.5" fill="#ffffff" />
  </g>
</svg>
